<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapmusik Guessr</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800;900&display=swap');

        :root {
            --bg-color: #050505;
            --surface: rgba(20, 20, 25, 0.35);
            --surface-border: rgba(255, 255, 255, 0.15);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        body, html { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text); 
            margin: 0; padding: 0; user-select: none; overflow: hidden; width: 100vw; height: 100vh;
        }

        #app-background {
            position: fixed; top: -2%; left: -2%; width: 104%; height: 104%;
            background-size: cover; background-position: center 20%;
            filter: blur(8px) brightness(0.4); 
            z-index: -2; transition: background-image 1s ease-in-out;
            background-color: var(--bg-color);
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 4px; z-index: -1; pointer-events: none;
        }

        #music-toggle-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--surface-border); color: white;
            padding: 10px 15px; border-radius: 12px; cursor: pointer; z-index: 100;
            transition: 0.3s; font-weight: 700; display: none;
        }
        #music-toggle-btn:hover { border-color: var(--primary); transform: scale(1.05); }

        h1 { color: var(--text); font-size: 40px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-shadow: 0 0 25px rgba(0,0,0,0.8); }

        #app-layout { display: none; width: 100%; height: 100%; flex-direction: row; }

        #mobile-menu-btn {
            position: fixed; top: 20px; left: 20px;
            background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(10px);
            border: 1px solid var(--primary); color: white;
            padding: 10px 15px; border-radius: 12px; cursor: pointer; z-index: 100;
            font-size: 16px; font-weight: bold; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 9;
        }

        #sidebar {
            width: 260px; height: 100%;
            background: rgba(5, 5, 10, 0.6); border-right: 1px solid var(--surface-border);
            backdrop-filter: blur(20px); display: flex; flex-direction: column; padding: 30px 0; box-shadow: 5px 0 30px rgba(0,0,0,0.5); z-index: 10;
        }

        .sidebar-logo { font-size: 26px; font-weight: 900; color: white; text-align: center; letter-spacing: 1px; margin-bottom: 30px; text-shadow: 0 0 15px rgba(139, 92, 246, 0.8); }
        .sidebar-logo span { color: var(--primary); }

        .sidebar-user { display: flex; align-items: center; gap: 15px; padding: 15px 25px; margin-bottom: 30px; background: rgba(0,0,0,0.4); border-top: 1px solid var(--surface-border); border-bottom: 1px solid var(--surface-border); }
        .sidebar-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .sidebar-name { font-size: 14px; font-weight: 800; text-transform: uppercase; }

        .nav-item { padding: 18px 25px; font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border-left: 4px solid transparent; display: flex; gap: 15px; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { color: white; border-left-color: var(--primary); background: rgba(139, 92, 246, 0.2); }

        #main-content { flex: 1; height: 100%; padding: 40px 50px; box-sizing: border-box; overflow-y: auto; }
        .tab-content { display: none; animation: fadeIn 0.4s ease forwards; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }

        .section-title { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; border-bottom: 2px solid var(--surface-border); padding-bottom: 10px; color: white; text-shadow: 0 0 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-between; }

        .banner-container { display: flex; align-items: center; gap: 25px; padding: 25px; border-radius: 16px; border: 2px solid var(--primary); background: linear-gradient(135deg, rgba(20,20,25,0.9), rgba(139,92,246,0.15)); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 40px; }
        .banner-img { width: 140px; height: 140px; border-radius: 16px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 8px 20px rgba(0,0,0,0.5); flex-shrink: 0; }
        .banner-text-box { text-align: left; }
        .banner-subtitle { margin: 0 0 5px 0; color: var(--text-muted); text-transform: uppercase; font-size: 12px; letter-spacing: 2px; }
        .banner-title { margin: 0; color: white; text-transform: uppercase; font-size: 32px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 15px rgba(139,92,246,0.8); }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .ea-card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--surface-border); border-top: 1px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 25px; cursor: pointer; transition: 0.3s; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; min-height: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .ea-card:hover { transform: translateY(-5px); border-color: var(--primary); background: rgba(139, 92, 246, 0.25); }
        
        .ea-card-icon { font-size: 32px; margin-bottom: 10px; }
        .ea-card-title { font-size: 18px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; color: white; text-shadow: 0 0 5px black;}
        .ea-card-desc { font-size: 12px; color: #e4e4e7; font-weight: 600; text-shadow: 0 0 5px black;}

        .card-highlight { border-color: rgba(139,92,246,0.5); }
        .card-sc { border-color: rgba(255,85,0,0.5); }
        .card-gold { border-color: rgba(245,158,11,0.5); }
        .card-fallen { border-color: rgba(255,255,255,0.5); }
        .card-stream { border-color: rgba(16,185,129,0.5); }
        .card-mystery { border-color: rgba(236, 72, 153, 0.5); }

        .artist-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .artist-tile { background: rgba(0,0,0,0.6); border: 1px solid var(--surface-border); padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 800; text-align: center; cursor: pointer; transition: 0.2s; color: white; backdrop-filter: blur(5px); }
        .artist-tile:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }

        .settings-bar { display: flex; gap: 20px; background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--surface-border); margin-bottom: 30px; align-items: center; backdrop-filter: blur(10px); flex-wrap: wrap;}
        .settings-group { display: flex; align-items: center; gap: 10px; }
        .settings-label { font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; }

        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #27272a; transition: .4s; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider.red { background-color: var(--danger); border-color: var(--danger); }
        input:checked + .slider.green { background-color: var(--success); border-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .ea-input { width: 100%; padding: 16px; background: rgba(0,0,0,0.7); border: 1px solid var(--surface-border); color: white; border-radius: 12px; font-size: 15px; font-weight: 600; box-sizing: border-box; margin-bottom: 15px; transition: 0.3s; backdrop-filter: blur(5px); }
        .ea-input:focus { outline: none; border-color: var(--primary); background: rgba(0,0,0,0.9); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
        select.ea-input { text-align: left; cursor: pointer; color: white !important; background-color: #141419 !important; }
        select.ea-input option { background-color: #141419 !important; color: #ffffff !important; padding: 12px; font-weight: 600; font-family: 'Poppins', sans-serif;}

        .btn-action { background: var(--primary); color: white; border: none; padding: 16px; font-size: 15px; font-weight: 800; border-radius: 12px; cursor: pointer; width: 100%; text-transform: uppercase; transition: 0.3s; box-shadow: 0 5px 15px rgba(139,92,246,0.3); }
        .btn-action:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.5); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); border: 1px solid #fcd34d; }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6); }

        #game-screen, #mystery-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .game-inner { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; position: relative; }

        .stats-bar { display: flex; justify-content: space-around; align-items: center; background: rgba(0,0,0,0.7); padding: 15px 20px; border-radius: 16px; border: 1px solid var(--surface-border); margin-bottom: 40px; flex-wrap: wrap;}
        .team-score-box { display: flex; flex-direction: column; align-items: center; }
        .team-score-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-align: center;}
        .team-score-num { font-size: 24px; font-weight: 900; }

        .visualizer { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(from 0deg, var(--primary), transparent); margin: 0 auto 40px auto; animation: spin 3s linear infinite; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(139,92,246,0.3); }
        .visualizer-inner { width: 100px; height: 100px; background-color: var(--bg-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2px solid rgba(139,92,246,0.5); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .game-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap;}
        .game-controls button { background: rgba(255,255,255,0.05); border: 1px solid var(--surface-border); color: white; padding: 10px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
        .game-controls button:hover { background: rgba(255,255,255,0.1); border-color: white; }

        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: rgba(0,0,0,0.6); border: 1px solid var(--surface-border); color: white; padding: 18px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); }
        .option-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }

        #text-input-container { position: relative; }
        #suggestions-box { position: absolute; bottom: 100%; left: 0; width: 100%; background: rgba(20,20,25,0.95); border: 1px solid var(--primary); border-radius: 12px; max-height: 200px; overflow-y: auto; text-align: left; display: none; margin-bottom: 5px; backdrop-filter: blur(10px); z-index: 50;}
        .suggestion-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; font-size: 14px; font-weight: 700; color: white;}
        .suggestion-item:hover { background: var(--primary); }

        /* Mystery Mode Screen */
        .mystery-box { background: rgba(20, 20, 25, 0.9); border: 1px solid var(--primary); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hint-row { font-size: 16px; font-weight: 700; color: white; margin-bottom: 15px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 4px solid var(--warning); display: none; animation: fadeIn 0.3s ease forwards; }

        #hl-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(25px); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .hl-inner { width: 100%; max-width: 900px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .hl-cards-container { display: flex; width: 100%; gap: 20px; justify-content: center; align-items: stretch; margin-top: 20px; }
        .hl-card { flex: 1; max-width: 400px; background: rgba(20, 20, 25, 0.7); border: 2px solid var(--surface-border); border-radius: 20px; padding: 25px; display: flex; flex-direction: column; align-items: center; text-align: center; backdrop-filter: blur(15px); box-shadow: 0 15px 35px rgba(0,0,0,0.5); transition: 0.3s; }
        .hl-cover { width: 180px; height: 180px; border-radius: 16px; object-fit: cover; box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .hl-song-title { font-size: 20px; font-weight: 900; color: white; margin: 0 0 5px 0; text-transform: uppercase; }
        .hl-artist-name { font-size: 14px; font-weight: 700; color: var(--primary); margin: 0 0 20px 0; }
        .hl-streams-val { font-size: 26px; font-weight: 900; color: var(--warning); margin: 10px 0; letter-spacing: 1px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .btn-hl { width: 100%; padding: 15px; border-radius: 12px; font-weight: 900; font-size: 16px; text-transform: uppercase; border: none; cursor: pointer; transition: 0.2s; margin-bottom: 10px; color: white; }
        .btn-hl.higher { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 5px 15px rgba(16,185,129,0.4); }
        .btn-hl.lower { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 5px 15px rgba(239,68,68,0.4); }
        .btn-hl:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: rgba(15, 15, 18, 0.95); padding: 40px; border-radius: 24px; border: 1px solid var(--surface-border); width: 90%; max-width: 480px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal h2 { font-size: 26px; margin: 0 0 10px 0; font-weight: 900; }
        .modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

        #feedback-cover { width: 160px; height: 160px; border-radius: 16px; object-fit: cover; margin: 0 auto 20px auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--surface-border); transition: all 0.5s ease; }
        .modal.correct { border-color: var(--success); box-shadow: 0 0 40px rgba(16, 185, 129, 0.2); } .modal.correct h2 { color: var(--success); }
        .modal.wrong { border-color: var(--danger); box-shadow: 0 0 40px rgba(239, 68, 68, 0.2); } .modal.wrong h2 { color: var(--danger); }
        .modal.gameover { border-color: var(--warning); box-shadow: 0 0 40px rgba(245, 158, 11, 0.2); } .modal.gameover h2 { color: var(--warning); }
        
        .modal.warning { border-color: var(--warning); box-shadow: 0 0 40px rgba(245, 158, 11, 0.4); } 
        .modal.warning h2 { color: var(--warning); text-shadow: 0 0 15px rgba(245, 158, 11, 0.8); }

        .loader { border: 4px solid rgba(255,255,255,0.05); border-top: 4px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }

        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--primary); cursor: pointer; margin-top: -5px; box-shadow: 0 0 10px rgba(139,92,246,0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
        input[type=range]:focus { outline: none; }

        @media (max-width: 768px) {
            #mobile-menu-btn { display: block; }
            #sidebar { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; z-index: 10; transition: left 0.3s ease; }
            #sidebar.open { left: 0; }
            #sidebar-overlay.active { display: block; }
            #main-content { padding: 80px 20px 20px 20px; }
            .cards-grid { grid-template-columns: 1fr; }
            h1 { font-size: 32px; }
            .section-title { font-size: 22px; }
            .hl-cards-container { flex-direction: column; align-items: center; gap: 15px; }
            .hl-card { width: 100%; padding: 15px; }
            .hl-cover { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <script>
        // Error Handler für saubere Fehlermeldungen (sollte ganz oben bleiben)
        window.onerror = function(message, source, lineno, colno, error) {
            let errDiv = document.getElementById('fatal-error-box');
            if(!errDiv) {
                errDiv = document.createElement('div');
                errDiv.id = 'fatal-error-box';
                errDiv.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#ef4444;color:white;padding:20px;border-radius:10px;z-index:999999;font-family:sans-serif;font-weight:bold;box-shadow:0 10px 30px rgba(0,0,0,0.8);';
                document.body.appendChild(errDiv);
            }
            errDiv.innerHTML = `🚨 Unerwarteter Absturz verhindert!<br><br>
